<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ENVPORT — paste .env, port it anywhere</title>
<meta name="description" content="Paste a .env file, instantly port it to shell export, docker run, Dockerfile, JSON, YAML and a TypeScript interface — plus a lint pass that catches duplicate keys and unquoted values. 100% local.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230d1117'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='%233ddc84' font-family='monospace'%3E%24_%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2129; --border:#2d333b;
    --text:#e6edf3; --dim:#8b949e; --accent:#3ddc84; --amber:#e3b341; --red:#f85149;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--mono);min-height:100vh;display:flex;flex-direction:column}
  header{padding:18px 20px 10px;text-align:center}
  header h1{font-size:1.35rem;letter-spacing:.12em;color:var(--accent)}
  header h1 .cursor{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  header p{color:var(--dim);font-size:.8rem;margin-top:6px}
  main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 20px 20px;max-width:1200px;width:100%;margin:0 auto}
  @media(max-width:820px){main{grid-template-columns:1fr}}
  .pane{background:var(--panel);border:1px solid var(--border);border-radius:10px;display:flex;flex-direction:column;overflow:hidden;min-height:340px}
  .pane-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .pane-head .label{font-size:.72rem;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
  #input{flex:1;width:100%;background:transparent;border:none;outline:none;resize:none;color:var(--text);font-family:var(--mono);font-size:.85rem;line-height:1.6;padding:14px}
  #input::placeholder{color:#556070}
  textarea#input{height:100%}
  .btn{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;font-family:var(--mono);font-size:.72rem;padding:6px 10px;cursor:pointer;transition:border-color .15s,color .15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.copying{border-color:var(--accent);color:var(--accent)}
  .tabs{display:flex;flex-wrap:wrap;gap:4px}
  .tab{background:transparent;border:1px solid transparent;color:var(--dim);border-radius:6px;font-family:var(--mono);font-size:.72rem;padding:5px 9px;cursor:pointer}
  .tab.active{background:var(--panel2);color:var(--accent);border-color:var(--border)}
  #output{flex:1;overflow:auto;padding:14px;white-space:pre;font-size:.8rem;line-height:1.65;color:#c9d1d9;tab-size:2}
  #output .k{color:var(--accent)}
  #output .c{color:#6e7681}
  #output .warn-line{color:var(--amber)}
  #outwrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
  .stats{display:flex;gap:10px;flex-wrap:wrap;padding:8px 14px;border-top:1px solid var(--border);font-size:.72rem;color:var(--dim)}
  .stats b{color:var(--text)}
  .stats .bad{color:var(--red)}
  .stats .warn{color:var(--amber)}
  #warnings{padding:8px 14px 0;font-size:.72rem;display:flex;flex-direction:column;gap:4px}
  #warnings:empty{display:none}
  .warnitem{color:var(--amber)}
  .erritem{color:var(--red)}
  footer{padding:10px;text-align:center;font-size:.68rem;color:#556070}
  footer a{color:var(--dim)}
  .empty-msg{color:#556070;font-style:italic}
</style>
</head>
<body>
<header>
  <h1>ENVPORT<span class="cursor">_</span></h1>
  <p>paste a .env on the left — get shell / docker / json / yaml / TS on the right, lint included. 100% local.</p>
</header>
<main>
  <section class="pane">
    <div class="pane-head">
      <span class="label">input · .env</span>
      <div style="display:flex;gap:6px">
        <button class="btn" id="sample">sample</button>
        <button class="btn" id="clear">clear</button>
      </div>
    </div>
    <textarea id="input" spellcheck="false" placeholder="# paste your .env here, or press SAMPLE
DATABASE_URL=postgres://localhost:5432/app
PORT=8080
DEBUG=true
API_KEY=&quot;sk-abc123&quot;
# comments are fine
CACHE_TTL=300"></textarea>
  </section>
  <section class="pane">
    <div class="pane-head">
      <div class="tabs" id="tabs"></div>
      <button class="btn" id="copy">copy</button>
    </div>
    <div id="outwrap">
      <div id="warnings"></div>
      <div id="output"></div>
    </div>
    <div class="stats" id="stats"></div>
  </section>
</main>
<footer>ENVPORT — nothing leaves your browser. No server, no upload, no tracking.</footer>
<script>
'use strict';
/* ---------- pure parsing core ---------- */
function parseEnv(text) {
  const entries = [];
  const warnings = [];
  const errors = [];
  const seen = new Map(); // KEY -> first line number
  const lines = String(text || '').split(/\r?\n/);
  let inMultiline = false; // quoted value spanning lines
  let pending = null;      // {key, value, lineNo}
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    const lineNo = i + 1;
    // continuation of a multi-line quoted value
    if (pending !== null) {
      pending.value += '\n' + raw;
      if ((pending.value.match(/"/g) || []).length % 2 === 0) {
        finishEntry(pending);
        pending = null;
      }
      continue;
    }
    let line = raw.trim();
    if (line === '') continue;
    if (line.startsWith('#')) continue; // full-line comment
    const eq = line.indexOf('=');
    if (eq === -1) {
      errors.push({ line: lineNo, msg: 'no "=" found — skipped this line' });
      continue;
    }
    let key = line.slice(0, eq).trim();
    let value = line.slice(eq + 1).trim();
    if (key.startsWith('export ')) key = key.replace(/^export\s+/, '');
    if (key === '') {
      errors.push({ line: lineNo, msg: 'missing key before "="' });
      continue;
    }
    if (/\s/.test(key)) {
      errors.push({ line: lineNo, msg: 'key "' + key + '" contains spaces' });
      continue;
    }
    if (/^[0-9]/.test(key)) {
      warnings.push({ line: lineNo, key: key, msg: 'key starts with a digit — many shells reject it' });
    }
    if (key !== key.toUpperCase() && /^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) {
      warnings.push({ line: lineNo, key: key, msg: 'lowercase key — env conventions use UPPER_SNAKE' });
    }
    // strip inline comment for unquoted values: VAL=abc # note
    let hadInlineComment = false;
    if (!/^(['"])/.test(value)) {
      const hash = value.indexOf(' #');
      if (hash !== -1) { value = value.slice(0, hash).trim(); hadInlineComment = true; }
    }
    // multi-line open quote
    const quotes = (value.match(/"/g) || []).length;
    const startsQ = /^"/.test(value);
    if (startsQ && quotes % 2 === 1) {
      pending = { key: key, value: value, lineNo: lineNo };
      continue;
    }
    finishEntry({ key: key, value: value, lineNo: lineNo, hadInlineComment: hadInlineComment });
  }
  if (pending !== null) {
    warnings.push({ line: pending.lineNo, key: pending.key, msg: 'unclosed quote — value kept as-is' });
    finishEntry(pending);
  }
  function finishEntry(e) {
    let v = e.value;
    let quote = null;
    if ((v.startsWith('"') && v.endsWith('"') && v.length >= 2)) quote = '"';
    else if ((v.startsWith("'") && v.endsWith("'") && v.length >= 2)) quote = "'";
    if (quote) v = v.slice(1, -1);
    if (quote === '"') v = v.replace(/\\n/g, '\n').replace(/\\t/g, '\t').replace(/\\r/g, '\r').replace(/\\"/g, '"').replace(/\\\\/g, '\\');
    if (!quote && v === '') {
      warnings.push({ line: e.lineNo, key: e.key, msg: 'empty value — exported as empty string' });
    }
    if (!quote && /\s/.test(v)) {
      warnings.push({ line: e.lineNo, key: e.key, msg: 'unquoted value contains spaces — some parsers will truncate it' });
    }
    if (quote === "'" && v.includes('$')) {
      // fine — single quotes are literal; no warning
    }
    if (seen.has(e.key)) {
      const firstLine = seen.get(e.key);
      warnings.push({ line: e.lineNo, key: e.key, msg: 'duplicate key — overrides the one on line ' + firstLine });
    } else {
      seen.set(e.key, e.lineNo);
    }
    entries.push({ key: e.key, value: v, quoted: quote, line: e.lineNo });
  }
  return { entries: entries, warnings: warnings, errors: errors };
}

function inferType(value) {
  if (value === '') return 'string';
  if (value === 'true' || value === 'false') return 'boolean';
  if (/^-?\d+$/.test(value)) return 'number';
  if (/^-?\d*\.\d+$/.test(value)) return 'number';
  return 'string';
}

/* ---------- formatters: entries -> [{k, c}] token rows ---------- */
function esc(s) { return s; }
function fmtShell(entries) {
  const out = [];
  for (const e of entries) {
    const v = /[\s"$`\\]/.test(e.value) ? "'" + e.value.replace(/'/g, "'\\''") + "'" : e.value;
    out.push([{ k: 'export ' + e.key + '=' }, { c: v }]);
  }
  return out;
}
function fmtDockerRun(entries) {
  const out = [];
  for (const e of entries) {
    const v = /[\s"'\\$]/.test(e.value) ? JSON.stringify(e.value) : e.value;
    out.push([{ k: '-e ' + e.key + '=' }, { c: v + ' \\' }]);
  }
  out.push([{ c: 'container-image:tag' }]);
  return out;
}
function fmtDockerfile(entries) {
  const out = [];
  for (const e of entries) {
    const v = /[\s"'\\$]/.test(e.value) ? JSON.stringify(e.value) : e.value;
    out.push([{ k: 'ENV ' + e.key + '=' }, { c: v }]);
  }
  return out;
}
function jsonValue(v) {
  const t = inferType(v);
  if (t === 'boolean' && (v === 'true' || v === 'false')) return v === 'true';
  if (t === 'number' && v !== '') return Number(v);
  return v;
}
function fmtJson(entries) {
  const obj = {};
  for (const e of entries) obj[e.key] = jsonValue(e.value);
  const out = [];
  out.push([{ c: '{' }]);
  const keys = Object.keys(obj);
  keys.forEach((k, i) => {
    const v = obj[k];
    const val = typeof v === 'string' ? '"' + v.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"' : String(v);
    out.push([{ k: '  "' + k + '": ' }, { c: val + (i < keys.length - 1 ? ',' : '') }]);
  });
  out.push([{ c: '}' }]);
  return out;
}
function yamlScalar(v) {
  const t = inferType(v);
  if (t === 'boolean' || t === 'number') return v;
  if (v === '' || /[:#{}\[\],&*?|>%@`"'\n]/.test(v) || /^\s|\s$/.test(v)) {
    return '"' + v.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"';
  }
  return v;
}
function fmtYaml(entries) {
  const out = [];
  for (const e of entries) {
    out.push([{ k: e.key + ': ' }, { c: yamlScalar(e.value) }]);
  }
  return out;
}
function fmtTs(entries) {
  const out = [];
  out.push([{ c: '// inferred from your values — tweak as needed' }]);
  out.push([{ k: 'interface Env' }, { c: ' {' }]);
  const used = new Set();
  for (const e of entries) {
    let name = /^[A-Za-z_$][A-Za-z0-9_$]*$/.test(e.key) ? e.key : null;
    if (!name) {
      let base = e.key.split(/[^A-Za-z0-9]+/).filter(Boolean).map((w, i) => i ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w.toLowerCase()).join('') || 'prop';
      let n = base, k = 2;
      while (used.has(n)) n = base + k++;
      name = n;
    }
    used.add(name);
    out.push([{ k: '  ' + name }, { c: ': ' + inferType(e.value) + ';' }]);
  }
  out.push([{ c: '}' }]);
  return out;
}
function fmtNormalized(entries) {
  const out = [];
  for (const e of entries) {
    const needsQuote = /\s|#|'|"|\\/.test(e.value);
    const v = needsQuote ? '"' + e.value.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n') + '"' : e.value;
    out.push([{ k: e.key + '=' }, { c: v }]);
  }
  return out;
}

const FORMATS = [
  { id: 'shell', label: 'shell', fn: fmtShell },
  { id: 'docker-run', label: 'docker run', fn: fmtDockerRun },
  { id: 'dockerfile', label: 'Dockerfile', fn: fmtDockerfile },
  { id: 'json', label: 'JSON', fn: fmtJson },
  { id: 'yaml', label: 'YAML', fn: fmtYaml },
  { id: 'ts', label: 'TS', fn: fmtTs },
  { id: 'env', label: '.env tidy', fn: fmtNormalized }
];

/* ---------- render ---------- */
let activeFormat = 'shell';
let lastRender = { rows: [], plain: '' };
const $input = document.getElementById('input');
const $output = document.getElementById('output');
const $tabs = document.getElementById('tabs');
const $stats = document.getElementById('stats');
const $warnings = document.getElementById('warnings');
const $copy = document.getElementById('copy');

FORMATS.forEach(f => {
  const b = document.createElement('button');
  b.className = 'tab' + (f.id === activeFormat ? ' active' : '');
  b.textContent = f.label;
  b.dataset.id = f.id;
  b.addEventListener('click', () => {
    activeFormat = f.id;
    $tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === f.id));
    render();
  });
  $tabs.appendChild(b);
});

function plainOf(rows) {
  return rows.map(r => r.map(t => t.k || t.c).join('')).join('\n');
}

function render() {
  const text = $input.value;
  if (!text.trim()) {
    lastRender = { rows: [], plain: '' };
    $output.innerHTML = '<span class="empty-msg">paste or type a .env on the left — results appear here instantly.</span>';
    $stats.innerHTML = '';
    $warnings.innerHTML = '';
    return;
  }
  const { entries, warnings, errors } = parseEnv(text);
  const fmt = FORMATS.find(f => f.id === activeFormat);
  const rows = fmt.fn(entries);
  lastRender = { rows: rows, plain: plainOf(rows) };
  // render with minimal syntax tint
  const html = rows.map(r => r.map(t => {
    if (t.k) return '<span class="k">' + escapeHtml(t.k) + '</span>';
    return '<span class="c">' + escapeHtml(t.c) + '</span>';
  }).join('')).join('\n');
  $output.innerHTML = html;
  // warnings
  $warnings.innerHTML =
    errors.map(e => '<div class="erritem">✕ line ' + e.line + ': ' + escapeHtml(e.msg) + '</div>').join('') +
    warnings.map(w => '<div class="warnitem">▲ line ' + w.line + ' · ' + escapeHtml(w.key) + ': ' + escapeHtml(w.msg) + '</div>').join('');
  const wCount = warnings.length, eCount = errors.length;
  $stats.innerHTML =
    '<span><b>' + entries.length + '</b> vars</span>' +
    (wCount ? '<span class="warn"><b>' + wCount + '</b> warning' + (wCount > 1 ? 's' : '') + '</span>' : '') +
    (eCount ? '<span class="bad"><b>' + eCount + '</b> error' + (eCount > 1 ? 's' : '') + '</span>' : '') +
    (!wCount && !eCount && entries.length ? '<span>✓ clean parse</span>' : '');
}

function escapeHtml(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

$input.addEventListener('input', render);

document.getElementById('clear').addEventListener('click', () => { $input.value = ''; render(); $input.focus(); });
document.getElementById('sample').addEventListener('click', () => {
  $input.value = [
    '# production env — pasted from the server',
    'DATABASE_URL=postgres://app:s3cret@db.internal:5432/prod',
    'PORT=8080',
    'DEBUG=false',
    'API_KEY="sk-live-abc123-xyz"',
    'SESSION_TTL=3600',
    'RATE_RATIO=0.75',
    'CACHE_PREFIX=myapp:cache # redis namespace',
    'FEATURE_FLAGS=dark_mode,beta_search',
    'session_ttl=900',
    'EMPTY_WEBHOOK=',
    'UNQUOTED_URL=https://example.com/a b?q=1',
    'FEATURE_FLAGS=dark_mode'
  ].join('\n');
  render();
});
$copy.addEventListener('click', () => {
  if (!lastRender.plain) return;
  const done = () => {
    $copy.classList.add('copying');
    $copy.textContent = 'copied ✓';
    setTimeout(() => { $copy.classList.remove('copying'); $copy.textContent = 'copy'; }, 1200);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(lastRender.plain).then(done, () => fallbackCopy(done));
  } else fallbackCopy(done);
});
function fallbackCopy(done) {
  const ta = document.createElement('textarea');
  ta.value = lastRender.plain;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); done(); } catch (e) { /* noop */ }
  document.body.removeChild(ta);
}

render();
</script>
</body>
</html>
