<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PixCaliper · 像素卡尺</title>
<meta name="description" content="粘贴截图即量的像素卡尺：放大镜取色、点两下出距离/角度，多测量清单，一键导出标注图。全程本地零上传。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📏</text></svg>">
<style>
:root{--bg:#0d1117;--fg:#e6edf3;--mut:#8b949e;--line:#21262d;--acc:#58a6ff;--acc2:#f78166;--ok:#3fb950;--panel:#161b22}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;
padding:max(20px,env(safe-area-inset-top)) 16px max(40px,env(safe-area-inset-bottom))}
main{max-width:980px;margin:0 auto}
h1{font-size:21px;letter-spacing:.3px}
.sub{color:var(--mut);font-size:13px;margin:4px 0 18px}
.sub b{color:var(--fg);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
button,.btn{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--fg);
font:inherit;font-size:13.5px;padding:9px 14px;border-radius:8px;cursor:pointer;min-height:38px;
display:inline-flex;align-items:center;gap:6px;transition:background .15s,border-color .15s;touch-action:manipulation}
button:hover{border-color:#30363d;background:#1c2129}
button:active{transform:translateY(1px)}
button.primary{background:#1f3a5f;border-color:#2f5a8f;color:#cfe6ff}
button.ghost{color:var(--mut)}
button:disabled{opacity:.45;cursor:not-allowed}
label.toggle{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mut);
border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;min-height:38px;cursor:pointer;user-select:none}
label.toggle input{accent-color:var(--acc)}
.stage{position:relative;border:1px solid var(--line);border-radius:10px;background:
repeating-conic-gradient(#11161c 0 25%,#0d1117 0 50%) 0 0/24px 24px;overflow:hidden;min-height:220px;
display:flex;align-items:center;justify-content:center}
.stage.dropping{border-color:var(--acc)}
#cv{display:block;max-width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
#hint{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
gap:10px;text-align:center;color:var(--mut);padding:24px;pointer-events:none}
#hint .big{font-size:15px;color:var(--fg)}
#hint kbd{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:1px 7px;font:12.5px ui-monospace,monospace}
#loupe{position:absolute;width:132px;height:132px;border-radius:50%;border:2px solid var(--acc);
overflow:hidden;display:none;pointer-events:none;background:#000;z-index:5;
box-shadow:0 6px 24px rgba(0,0,0,.55)}
#lcv{width:132px;height:132px;image-rendering:pixelated;display:block}
#linfo{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(13,17,23,.88);
color:#fff;font:11.5px ui-monospace,monospace;padding:2px 8px;border-radius:5px;white-space:nowrap}
.stat{color:var(--mut);font-size:12.5px;margin:10px 2px 0;font-variant-numeric:tabular-nums}
h2{font-size:14px;color:var(--mut);font-weight:600;margin:20px 2px 8px;letter-spacing:.5px}
.mrow{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);padding:9px 4px;font-size:13.5px;cursor:pointer}
.mrow:last-child{border-bottom:1px solid var(--line)}
.mrow.sel{background:#131c28}
.mrow .idx{color:var(--acc);font-variant-numeric:tabular-nums;min-width:26px}
.mrow .body{flex:1;min-width:0;display:flex;flex-wrap:wrap;gap:4px 14px;font-variant-numeric:tabular-nums}
.mrow .d{font-weight:600}
.mrow .sw{width:13px;height:13px;border-radius:3px;border:1px solid #30363d;display:inline-block;vertical-align:-2px;margin-right:4px}
.mrow .del{border:none;background:none;color:var(--mut);font-size:15px;padding:2px 8px;min-height:0;line-height:1.4}
.mrow .del:hover{color:var(--acc2)}
.empty{color:var(--mut);font-size:13px;padding:10px 4px}
#toast{position:fixed;left:50%;bottom:max(24px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);
background:#1c2129;border:1px solid #30363d;color:var(--fg);padding:9px 18px;border-radius:9px;font-size:13.5px;
opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;max-width:88vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.err{border-color:#8f3a3a;color:#ffb0b0}
.foot{margin-top:26px;color:var(--mut);font-size:12.5px}
.foot a{color:var(--acc);text-decoration:none}
@media (max-width:640px){.bar button,.bar .btn,.bar label.toggle{padding:8px 11px;font-size:12.5px}.mrow .body{font-size:12.5px}}
</style>
</head>
<body>
<main>
<h1>📏 PixCaliper <span style="color:var(--mut);font-weight:400;font-size:15px">像素卡尺</span></h1>
<p class="sub">粘贴截图即量的卡尺：<b>Ctrl+V</b> 贴图 → 放大镜对准像素 → 点两下出距离/位移/角度，多把卡尺成清单，报告与标注图一键带走。全程本地，不上传任何数据。</p>

<div class="bar">
  <button class="primary" id="btnPaste" type="button">📋 粘贴截图</button>
  <label class="btn" for="file">📂 选择图片</label>
  <input type="file" id="file" accept="image/*" hidden>
  <button id="btnDemo" type="button">🖼️ 示例截图</button>
  <button id="btnCopy" type="button" disabled>📄 复制报告</button>
  <button id="btnPng" type="button" disabled>⬇️ 导出标注图</button>
  <button id="btnClear" type="button" class="ghost" disabled>🗑️ 清空</button>
  <label class="toggle"><input type="checkbox" id="lock45">锁 45°</label>
</div>

<div class="stage" id="stage">
  <canvas id="cv" width="10" height="10"></canvas>
  <div id="hint">
    <div class="big">把截图贴进来，开始测量</div>
    <div>按 <kbd>Ctrl/⌘ + V</kbd> 粘贴 · 或拖拽图片到此处 · 或点击上方按钮</div>
    <div>载入后：鼠标移动带放大镜取色，<b>点两下</b>画一把卡尺（按住 <kbd>Shift</kbd> 锁定 45°）</div>
  </div>
  <div id="loupe"><canvas id="lcv" width="132" height="132"></canvas><div id="linfo">#000000</div></div>
</div>
<div class="stat" id="stat">未载入图片</div>

<h2>测量清单</h2>
<div id="mlist"><div class="empty">还没有测量。点画布两下即可画第一把卡尺。</div></div>

<div class="foot">PixCaliper · 每日创意小工具 #39 · <a href="../">返回目录</a> · 纯前端本地处理，图片不离开浏览器</div>
</main>
<div id="toast"></div>
<script>
"use strict";
/* ============ state ============ */
var cv = document.getElementById('cv'), ctx = cv.getContext('2d');
var stage = document.getElementById('stage'), hint = document.getElementById('hint');
var loupe = document.getElementById('loupe'), lcv = document.getElementById('lcv'), lctx = lcv.getContext('2d');
var linfo = document.getElementById('linfo'), stat = document.getElementById('stat'), mlistEl = document.getElementById('mlist');
var toastEl = document.getElementById('toast');
var src = document.createElement('canvas'), sctx = src.getContext('2d'), srcData = null;
var img = null, measures = [], pending = null, selected = -1, exportUrl = null;
var ZOOM = 8, LPX = 132;

function $(id){ return document.getElementById(id); }
function toast(msg, isErr){
  toastEl.textContent = msg;
  toastEl.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ toastEl.className = ''; }, 2200);
}
function hasImg(){ return !!img; }
function fmt(n, d){ return n.toFixed(d === undefined ? 1 : d); }

/* ============ image loading ============ */
function setupImage(image, name){
  if (!image.width || !image.height){ toast('图片尺寸无效', true); return; }
  img = image; measures = []; pending = null; selected = -1;
  cv.width = img.width; cv.height = img.height;
  src.width = img.width; src.height = img.height;
  sctx.drawImage(img, 0, 0);
  srcData = sctx.getImageData(0, 0, img.width, img.height).data;
  hint.style.display = 'none';
  redraw(); renderList(); updateBtns();
  stat.textContent = '已载入 ' + (name ? name + ' · ' : '') + img.width + '×' + img.height + ' px · 点击两下开始测量';
  toast('已载入 ' + img.width + '×' + img.height);
}
function loadFile(file){
  if (!file){ return; }
  if (!file.type || file.type.indexOf('image/') !== 0){ toast('这不是图片文件（' + (file.type || '未知类型') + '）', true); return; }
  var url = URL.createObjectURL(file);
  var im = new Image();
  im.onload = function(){ setupImage(im, file.name || '粘贴图片'); URL.revokeObjectURL(url); };
  im.onerror = function(){ toast('图片解码失败', true); URL.revokeObjectURL(url); };
  im.src = url;
}
document.getElementById('file').addEventListener('change', function(e){
  loadFile(e.target.files && e.target.files[0]); e.target.value = '';
});
document.addEventListener('paste', function(e){
  var items = e.clipboardData && e.clipboardData.items;
  if (!items) return;
  for (var i = 0; i < items.length; i++){
    if (items[i].type && items[i].type.indexOf('image/') === 0){
      loadFile(items[i].getAsFile()); e.preventDefault(); return;
    }
  }
});
$('btnPaste').addEventListener('click', function(){
  toast('按 Ctrl/⌘ + V 粘贴截图（截图后直接在本页按粘贴）');
});
stage.addEventListener('dragover', function(e){ e.preventDefault(); stage.classList.add('dropping'); });
stage.addEventListener('dragleave', function(){ stage.classList.remove('dropping'); });
stage.addEventListener('drop', function(e){
  e.preventDefault(); stage.classList.remove('dropping');
  if (e.dataTransfer.files && e.dataTransfer.files.length) loadFile(e.dataTransfer.files[0]);
});

/* ============ demo screenshot (procedural) ============ */
$('btnDemo').addEventListener('click', function(){
  var c = document.createElement('canvas'); c.width = 800; c.height = 500;
  var g = c.getContext('2d');
  g.fillStyle = '#f6f8fa'; g.fillRect(0, 0, 800, 500);
  g.fillStyle = '#24292f'; g.fillRect(0, 0, 800, 44);
  ['#f85149','#d29922','#3fb950'].forEach(function(col, i){
    g.fillStyle = col; g.beginPath(); g.arc(22 + i * 20, 22, 6, 0, 7); g.fill();
  });
  g.fillStyle = '#ffffff'; g.font = '600 15px sans-serif'; g.fillText('Admin Dashboard', 90, 28);
  g.fillStyle = '#1f2937'; g.fillRect(0, 44, 170, 456);
  g.fillStyle = '#9ca3af'; g.font = '13px sans-serif';
  ['Overview','Orders','Products','Customers','Settings'].forEach(function(t, i){
    g.fillStyle = i === 0 ? '#ffffff' : '#9ca3af'; g.fillText(t, 24, 84 + i * 34);
  });
  g.fillStyle = '#ffffff'; g.strokeStyle = '#e5e7eb';
  g.fillRect(194, 68, 280, 150); g.strokeRect(194, 68, 280, 150);
  g.fillStyle = '#6b7280'; g.font = '600 13px sans-serif'; g.fillText('Revenue', 212, 94);
  g.fillStyle = '#111827'; g.font = '700 26px sans-serif'; g.fillText('¥48,201', 212, 130);
  g.fillStyle = '#10b981'; g.beginPath(); g.moveTo(212, 190);
  for (var x = 0; x <= 240; x += 20){ g.lineTo(212 + x, 190 - Math.sin(x / 38) * 14 - x / 14); }
  g.strokeStyle = '#10b981'; g.lineWidth = 2.5; g.stroke(); g.lineWidth = 1;
  g.fillStyle = '#ffffff'; g.strokeStyle = '#e5e7eb';
  g.fillRect(494, 68, 282, 150); g.strokeRect(494, 68, 282, 150);
  g.fillStyle = '#6b7280'; g.font = '600 13px sans-serif'; g.fillText('Orders', 512, 94);
  g.fillStyle = '#111827'; g.font = '700 26px sans-serif'; g.fillText('1,284', 512, 130);
  g.fillStyle = '#2563eb'; g.fillRect(512, 150, 180, 12); g.fillRect(512, 172, 120, 12);
  g.fillStyle = '#cbd5e1'; g.fillRect(512, 194, 220, 12);
  g.fillStyle = '#ffffff'; g.strokeStyle = '#e5e7eb';
  g.fillRect(194, 242, 582, 190); g.strokeRect(194, 242, 582, 190);
  g.fillStyle = '#6b7280'; g.font = '600 13px sans-serif'; g.fillText('Recent orders', 212, 268);
  for (var r = 0; r < 4; r++){
    g.fillStyle = '#f3f4f6'; g.fillRect(212, 284 + r * 34, 546, 24);
    g.fillStyle = '#374151'; g.font = '12px sans-serif';
    g.fillText('#' + (10240 + r * 7), 222, 300 + r * 34);
    g.fillText(r % 2 ? 'Shipped' : 'Pending', 560, 300 + r * 34);
  }
  g.fillStyle = '#2563eb'; g.fillRect(640, 296, 96, 34);
  g.fillStyle = '#ffffff'; g.font = '600 13px sans-serif'; g.fillText('New order', 654, 318);
  var im = new Image();
  im.onload = function(){ setupImage(im, '示例截图'); };
  im.src = c.toDataURL('image/png');
});

/* ============ geometry ============ */
function canvasPos(e){
  var r = cv.getBoundingClientRect();
  var x = Math.round((e.clientX - r.left) * (cv.width / r.width));
  var y = Math.round((e.clientY - r.top) * (cv.height / r.height));
  return { x: Math.max(0, Math.min(cv.width - 1, x)), y: Math.max(0, Math.min(cv.height - 1, y)) };
}
function pixelAt(x, y){
  x = Math.max(0, Math.min(src.width - 1, x | 0)); y = Math.max(0, Math.min(src.height - 1, y | 0));
  var i = (y * src.width + x) * 4;
  var hex = '#' + [srcData[i], srcData[i + 1], srcData[i + 2]].map(function(v){
    return ('0' + v.toString(16)).slice(-2).toUpperCase(); }).join('');
  return hex;
}
function calc(m){
  var dx = m.x2 - m.x1, dy = m.y2 - m.y1;
  m.dx = dx; m.dy = dy;
  m.dist = Math.hypot(dx, dy);
  m.ang = Math.atan2(-dy, dx) * 180 / Math.PI;
  m.c1 = pixelAt(m.x1, m.y1); m.c2 = pixelAt(m.x2, m.y2);
}
function applyLock(a, b, lock){
  if (!lock) return b;
  var dx = b.x - a.x, dy = b.y - a.y;
  if (dx === 0 && dy === 0) return b;
  var step = Math.PI / 4;
  var k = Math.round(Math.atan2(dy, dx) / step);
  var len = Math.hypot(dx, dy);
  return { x: Math.round(a.x + Math.cos(k * step) * len), y: Math.round(a.y + Math.sin(k * step) * len) };
}

/* ============ drawing ============ */
function pill(g, x, y, text, hl){
  g.font = '600 13px ui-monospace,Menlo,monospace';
  var w = g.measureText(text).width + 14;
  var px = Math.max(2, Math.min(cv.width - w - 2, x - w / 2));
  var py = Math.max(2, y - 30 < 2 ? y + 10 : y - 30);
  g.fillStyle = hl ? 'rgba(31,111,235,.94)' : 'rgba(13,17,23,.88)';
  g.strokeStyle = hl ? '#79b8ff' : '#30363d';
  g.beginPath();
  if (g.roundRect){ g.roundRect(px, py, w, 22, 6); } else { g.rect(px, py, w, 22); }
  g.fill(); g.stroke();
  g.fillStyle = '#fff'; g.textBaseline = 'middle';
  g.fillText(text, px + 7, py + 12);
  g.textBaseline = 'alphabetic';
}
function drawMark(g, x, y, color, i){
  g.strokeStyle = color; g.lineWidth = 2;
  g.beginPath(); g.arc(x, y, 6, 0, 7); g.stroke();
  g.fillStyle = color;
  g.beginPath(); g.arc(x, y, 2, 0, 7); g.fill();
  if (i !== undefined){
    g.font = '700 11px ui-monospace,monospace'; g.fillStyle = color;
    g.fillText(i, x + 9, y - 8);
  }
}
function redraw(){
  if (!img) return;
  ctx.drawImage(img, 0, 0);
  measures.forEach(function(m, i){
    var hl = i === selected;
    ctx.strokeStyle = hl ? '#58a6ff' : '#f78166';
    ctx.lineWidth = hl ? 2.5 : 1.5;
    ctx.setLineDash([7, 5]);
    ctx.beginPath(); ctx.moveTo(m.x1 + .5, m.y1 + .5); ctx.lineTo(m.x2 + .5, m.y2 + .5); ctx.stroke();
    ctx.setLineDash([]);
    drawMark(ctx, m.x1, m.y1, hl ? '#58a6ff' : '#f78166', String(i + 1));
    drawMark(ctx, m.x2, m.y2, hl ? '#58a6ff' : '#f78166');
    pill(ctx, (m.x1 + m.x2) / 2, (m.y1 + m.y2) / 2, fmt(m.dist) + ' px  ' + fmt(m.ang) + '°', hl);
  });
  if (pending) drawMark(ctx, pending.x, pending.y, '#58a6ff', '?');
}
function updateBtns(){
  var on = measures.length > 0;
  $('btnCopy').disabled = !on; $('btnPng').disabled = !on; $('btnClear').disabled = !on;
}

/* ============ interaction ============ */
stage.addEventListener('click', function(e){
  if (!hasImg() && e.target !== cv){ toast('先载入一张截图（Ctrl+V / 拖拽 / 示例截图）', true); }
});
cv.addEventListener('click', function(e){
  if (!hasImg()){ toast('先载入一张截图（Ctrl+V / 拖拽 / 示例截图）', true); return; }
  var p = canvasPos(e);
  if (!pending){
    pending = p; selected = -1; redraw();
    stat.textContent = '起点 (' + p.x + ', ' + p.y + ') 已定 · 再点一下确定终点';
    return;
  }
  var q = applyLock(pending, p, $('lock45').checked || e.shiftKey);
  var m = { x1: pending.x, y1: pending.y, x2: q.x, y2: q.y };
  calc(m);
  if (m.dist < 1){ pending = null; redraw(); toast('两点重合了，距离为 0，已取消', true); renderList(); return; }
  measures.push(m); pending = null; selected = measures.length - 1;
  redraw(); renderList(); updateBtns();
  stat.textContent = '已载入 ' + img.width + '×' + img.height + ' px · 已测量 ' + measures.length + ' 处';
});
cv.addEventListener('mousemove', function(e){
  if (!hasImg()) return;
  var p = canvasPos(e);
  drawLoupe(p.x, p.y);
  var r = cv.getBoundingClientRect();
  var lx = e.clientX - r.left + 18, ly = e.clientY - r.top - LPX - 14;
  if (ly < 4) ly = e.clientY - r.top + 18;
  lx = Math.max(4, Math.min(r.width - LPX - 4, lx));
  loupe.style.left = lx + 'px'; loupe.style.top = ly + 'px'; loupe.style.display = 'block';
});
cv.addEventListener('mouseleave', function(){ loupe.style.display = 'none'; });
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && pending){ pending = null; redraw(); toast('已取消起点'); }
});
function drawLoupe(x, y){
  var half = LPX / 2 / ZOOM;
  lctx.imageSmoothingEnabled = false;
  lctx.fillStyle = '#000'; lctx.fillRect(0, 0, LPX, LPX);
  lctx.drawImage(src, x - half, y - half, half * 2, half * 2, 0, 0, LPX, LPX);
  lctx.strokeStyle = 'rgba(88,166,255,.55)'; lctx.lineWidth = 1;
  for (var i = 1; i < ZOOM; i++){
    var t = Math.round(i * LPX / ZOOM) + .5;
    lctx.beginPath(); lctx.moveTo(t, 0); lctx.lineTo(t, LPX); lctx.stroke();
    lctx.beginPath(); lctx.moveTo(0, t); lctx.lineTo(LPX, t); lctx.stroke();
  }
  lctx.strokeStyle = '#58a6ff'; lctx.strokeRect(Math.round(LPX / 2 - ZOOM / 2) + .5, Math.round(LPX / 2 - ZOOM / 2) + .5, ZOOM, ZOOM);
  linfo.textContent = pixelAt(x, y) + '  (' + x + ', ' + y + ')';
}

/* ============ list & report ============ */
function lineText(m, i){
  return (i + 1) + '. ' + fmt(m.dist) + ' px  ·  Δ(' + (m.dx >= 0 ? '+' : '') + m.dx + ', ' + (m.dy >= 0 ? '+' : '') + m.dy + ')  ·  '
    + fmt(m.ang) + '°  ·  ' + m.c1 + ' → ' + m.c2;
}
function renderList(){
  if (!measures.length){
    mlistEl.innerHTML = '<div class="empty">' + (hasImg()
      ? '还没有测量。点画布两下即可画第一把卡尺。'
      : '载入截图后，点画布两下即可画第一把卡尺。') + '</div>';
    return;
  }
  mlistEl.innerHTML = '';
  measures.forEach(function(m, i){
    var row = document.createElement('div');
    row.className = 'mrow' + (i === selected ? ' sel' : '');
    var idx = document.createElement('span'); idx.className = 'idx'; idx.textContent = i + 1;
    var body = document.createElement('span'); body.className = 'body';
    var d = document.createElement('span'); d.className = 'd'; d.textContent = fmt(m.dist) + ' px';
    var dl = document.createElement('span'); dl.textContent = 'Δ(' + (m.dx >= 0 ? '+' : '') + m.dx + ', ' + (m.dy >= 0 ? '+' : '') + m.dy + ') · ' + fmt(m.ang) + '°';
    var cl = document.createElement('span');
    var s1 = document.createElement('span'); s1.className = 'sw'; s1.style.background = m.c1;
    var s2 = document.createElement('span'); s2.className = 'sw'; s2.style.background = m.c2;
    cl.appendChild(s1); cl.appendChild(s2);
    cl.appendChild(document.createTextNode(m.c1 + '→' + m.c2));
    body.appendChild(d); body.appendChild(dl); body.appendChild(cl);
    var del = document.createElement('button'); del.className = 'del'; del.type = 'button';
    del.title = '删除这条测量'; del.textContent = '✕';
    del.addEventListener('click', function(ev){
      ev.stopPropagation();
      measures.splice(i, 1); selected = -1; pending = null;
      redraw(); renderList(); updateBtns();
      stat.textContent = hasImg() ? ('已载入 ' + img.width + '×' + img.height + ' px · 已测量 ' + measures.length + ' 处') : stat.textContent;
    });
    row.appendChild(idx); row.appendChild(body); row.appendChild(del);
    row.addEventListener('click', function(){
      selected = (selected === i ? -1 : i); redraw(); renderList();
    });
    mlistEl.appendChild(row);
  });
}
function buildReport(){
  var lines = ['PixCaliper 测量报告 · ' + img.width + '×' + img.height + ' px · ' + new Date().toLocaleString(),
    '————————————————'];
  measures.forEach(function(m, i){ lines.push(lineText(m, i)); });
  return lines.join('\n');
}
$('btnCopy').addEventListener('click', function(){
  var t = buildReport();
  var done = function(){ toast('报告已复制 ✓'); };
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(done, function(){ fallbackCopy(t); done(); });
  } else { fallbackCopy(t); done(); }
});
function fallbackCopy(t){
  var ta = document.createElement('textarea');
  ta.value = t; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); } catch (err) {}
  document.body.removeChild(ta);
}
$('btnClear').addEventListener('click', function(){
  measures = []; pending = null; selected = -1;
  redraw(); renderList(); updateBtns();
  stat.textContent = '已载入 ' + img.width + '×' + img.height + ' px · 已清空测量';
  toast('已清空');
});

/* ============ export annotated png ============ */
$('btnPng').addEventListener('click', function(){
  var pad = 28;
  var out = document.createElement('canvas');
  out.width = cv.width + pad * 2; out.height = cv.height + pad * 2;
  var g = out.getContext('2d');
  g.fillStyle = '#0d1117'; g.fillRect(0, 0, out.width, out.height);
  g.drawImage(cv, pad, pad);
  g.translate(pad, pad);
  measures.forEach(function(m, i){
    var hl = i === selected;
    g.strokeStyle = hl ? '#58a6ff' : '#f78166'; g.lineWidth = 2;
    g.setLineDash([7, 5]);
    g.beginPath(); g.moveTo(m.x1 + .5, m.y1 + .5); g.lineTo(m.x2 + .5, m.y2 + .5); g.stroke();
    g.setLineDash([]);
    drawMark(g, m.x1, m.y1, hl ? '#58a6ff' : '#f78166', String(i + 1));
    drawMark(g, m.x2, m.y2, hl ? '#58a6ff' : '#f78166');
    pill(g, (m.x1 + m.x2) / 2, (m.y1 + m.y2) / 2, fmt(m.dist) + ' px  ' + fmt(m.ang) + '°', hl);
  });
  out.toBlob(function(blob){
    if (!blob){ toast('导出失败', true); return; }
    if (exportUrl) URL.revokeObjectURL(exportUrl);
    exportUrl = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = exportUrl; a.download = 'pixcaliper-' + Date.now() + '.png';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    toast('标注图已导出（' + out.width + '×' + out.height + '）');
  }, 'image/png');
});

/* ============ init ============ */
redraw();
</script>
</body>
