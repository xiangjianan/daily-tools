<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCALELENS · 音阶透镜 — 把乐理点亮在琴键上</title>
<meta name="description" content="选一个调，琴键立刻点亮成任意音阶或和弦；点键能弹、一键整条试听，乐理公式看得见。纯前端本地运行，零上传。">
<style>
  :root{
    --bg:#0e1117; --panel:#161b24; --panel2:#1c2330; --line:#2a3342;
    --text:#e7ecf3; --muted:#8b96a8; --accent:#38d39f; --accent2:#f0b429;
    --white-key:#e9edf2; --white-key-hi:#bfe9d9; --black-key:#20242c; --black-key-hi:#38d39f;
  }
  *{box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    min-height:100vh; padding:16px 14px 40px;
  }
  .wrap{max-width:860px; margin:0 auto;}
  header{margin-bottom:14px;}
  h1{font-size:22px; letter-spacing:.5px;}
  h1 .lens{color:var(--accent);}
  .sub{color:var(--muted); font-size:13px; margin-top:4px; line-height:1.5;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .label{font-size:12px; color:var(--muted); margin-bottom:8px; letter-spacing:.5px;}
  .seg{display:flex; gap:6px; margin-bottom:12px;}
  .seg button{
    flex:1; padding:9px 0; border-radius:9px; border:1px solid var(--line);
    background:var(--panel2); color:var(--muted); font-size:14px; cursor:pointer; font-weight:600;
  }
  .seg button.on{background:var(--accent); border-color:var(--accent); color:#08281d;}
  .roots{display:grid; grid-template-columns:repeat(6,1fr); gap:6px; margin-bottom:12px;}
  .roots button{
    padding:9px 0; border-radius:9px; border:1px solid var(--line); background:var(--panel2);
    color:var(--text); font-size:14px; cursor:pointer; font-weight:600;
  }
  .roots button.on{background:var(--accent2); border-color:var(--accent2); color:#3a2a00;}
  .chips{display:flex; flex-wrap:wrap; gap:7px;}
  .chips button{
    padding:8px 13px; border-radius:999px; border:1px solid var(--line); background:var(--panel2);
    color:var(--text); font-size:13px; cursor:pointer;
  }
  .chips button.on{background:rgba(56,211,159,.16); border-color:var(--accent); color:var(--accent); font-weight:700;}
  .info{display:flex; flex-wrap:wrap; align-items:center; gap:8px; row-gap:10px;}
  .name{font-size:19px; font-weight:800; margin-right:4px;}
  .name small{color:var(--muted); font-weight:500; font-size:13px; margin-left:6px;}
  .formula{color:var(--muted); font-size:13px; font-family:ui-monospace,Menlo,Consolas,monospace;}
  .nlist{display:flex; flex-wrap:wrap; gap:5px; width:100%;}
  .nlist span{
    background:var(--panel2); border:1px solid var(--line); border-radius:7px;
    padding:4px 9px; font-size:13px; font-family:ui-monospace,Menlo,Consolas,monospace;
  }
  .nlist span.root{border-color:var(--accent2); color:var(--accent2); font-weight:700;}
  .btns{display:flex; gap:8px; width:100%; margin-top:2px;}
  .btns button{
    flex:1; padding:11px 0; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer;
  }
  #playBtn{background:var(--accent); color:#08281d;}
  #playBtn.stop{background:#e5534b; color:#fff;}
  #copyBtn{background:var(--panel2); color:var(--text); border:1px solid var(--line); flex:0 0 34%;}
  .pianoCard{padding:12px 10px;}
  #piano{position:relative; height:190px; user-select:none; touch-action:manipulation;}
  .wk{
    position:absolute; top:0; bottom:0; background:var(--white-key);
    border:1px solid #9aa4b2; border-radius:0 0 7px 7px; cursor:pointer;
  }
  .bk{
    position:absolute; top:0; height:60%; background:var(--black-key);
    border:1px solid #000; border-radius:0 0 5px 5px; cursor:pointer; z-index:2;
  }
  .wk.hit{background:var(--white-key-hi); border-color:var(--accent);}
  .bk.hit{background:var(--black-key-hi); border-color:var(--accent);}
  .kt{position:absolute; bottom:6px; width:100%; text-align:center; font-size:11px; color:#556; font-weight:700; pointer-events:none;}
  .bk .kt{color:#cfd6e0;}
  .wk.hit .kt{color:#0a5c41;}
  .bk.hit .kt{color:#08281d;}
  .flash{animation:flash .35s;}
  @keyframes flash{0%{filter:brightness(1.6);}100%{filter:brightness(1);}}
  .foot{color:var(--muted); font-size:12px; text-align:center; line-height:1.6; margin-top:14px;}
  .foot a{color:var(--muted);}
  #toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:var(--accent); color:#08281d; padding:9px 18px; border-radius:999px;
    font-size:14px; font-weight:700; opacity:0; pointer-events:none; transition:all .25s; z-index:9;
  }
  #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  @media (max-width:560px){
    .roots{grid-template-columns:repeat(6,1fr);}
    .roots button{padding:11px 0; font-size:13px;}
    #piano{height:150px;}
    .name{font-size:17px;}
    h1{font-size:19px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>SCALELENS <span class="lens">·</span> 音阶透镜</h1>
    <div class="sub">选一个调，琴键立刻点亮成音阶或和弦。点键能弹，一键整条试听，乐理公式看得见。所有声音与计算都在你的浏览器本地完成。</div>
  </header>

  <div class="card">
    <div class="label">类型</div>
    <div class="seg">
      <button id="catScale" class="on">音阶 / 调式</button>
      <button id="catChord">和弦</button>
    </div>
    <div class="label">根音</div>
    <div class="roots" id="roots"></div>
    <div class="label" id="typeLabel">音阶</div>
    <div class="chips" id="types"></div>
  </div>

  <div class="card">
    <div class="info">
      <div class="name" id="scaleName">C 大调<small>Major</small></div>
      <div class="formula" id="scaleFormula"></div>
      <div class="nlist" id="noteList"></div>
      <div class="btns">
        <button id="playBtn">▶ 整条试听</button>
        <button id="copyBtn">复制音级</button>
      </div>
    </div>
  </div>

  <div class="card pianoCard">
    <div class="label">键盘（点键试音 · 高亮键属于当前音集）</div>
    <div id="piano"></div>
  </div>

  <div class="foot">SCALELENS · 每日创意小工具 #36 · 数据与声音 100% 本地处理，零上传零依赖<br>源自 <a href="https://github.com/xiangjianan/daily-tools" target="_blank" rel="noopener">daily-tools</a></div>
</div>
<div id="toast"></div>

<script>
"use strict";
/* ---------- 数据 ---------- */
var NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
var SCALES = [
  {n:"大调",       en:"Major",            iv:[0,2,4,5,7,9,11]},
  {n:"自然小调",   en:"Natural Minor",    iv:[0,2,3,5,7,8,10]},
  {n:"和声小调",   en:"Harmonic Minor",   iv:[0,2,3,5,7,8,11]},
  {n:"多利亚",     en:"Dorian",           iv:[0,2,3,5,7,9,10]},
  {n:"弗里几亚",   en:"Phrygian",         iv:[0,1,3,5,7,8,10]},
  {n:"利底亚",     en:"Lydian",           iv:[0,2,4,6,7,9,11]},
  {n:"混合利底亚", en:"Mixolydian",       iv:[0,2,4,5,7,9,10]},
  {n:"洛克里亚",   en:"Locrian",          iv:[0,1,3,5,6,8,10]},
  {n:"大五声",     en:"Major Pentatonic", iv:[0,2,4,7,9]},
  {n:"小五声",     en:"Minor Pentatonic", iv:[0,3,5,7,10]},
  {n:"布鲁斯",     en:"Blues",            iv:[0,3,5,6,7,10]},
  {n:"全音阶",     en:"Whole Tone",       iv:[0,2,4,6,8,10]}
];
var CHORDS = [
  {n:"大三和弦", en:"Major",       iv:[0,4,7]},
  {n:"小三和弦", en:"Minor",       iv:[0,3,7]},
  {n:"减三和弦", en:"Diminished",  iv:[0,3,6]},
  {n:"增三和弦", en:"Augmented",   iv:[0,4,8]},
  {n:"挂四和弦", en:"Sus4",        iv:[0,5,7]},
  {n:"属七和弦", en:"Dominant 7th",iv:[0,4,7,10]},
  {n:"大七和弦", en:"Major 7th",   iv:[0,4,7,11]},
  {n:"小七和弦", en:"Minor 7th",   iv:[0,3,7,10]}
];

/* ---------- 状态 ---------- */
var state = { cat:"scale", root:0, typeIdx:0, playing:false, timers:[] };

/* ---------- 音频 ---------- */
var ac = null;
function ensureAC(){
  if(!ac){
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return null;
    ac = new AC();
  }
  if(ac.state === "suspended") ac.resume();
  return ac;
}
function freqOf(midi){ return 440 * Math.pow(2, (midi - 69) / 12); }
function pluck(midi, when, dur, vol){
  var ctx = ensureAC(); if(!ctx) return;
  var t = ctx.currentTime + when;
  var osc = ctx.createOscillator(), g = ctx.createGain();
  osc.type = "triangle";
  osc.frequency.value = freqOf(midi);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.28, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(g); g.connect(ctx.destination);
  osc.start(t); osc.stop(t + dur + 0.05);
}

/* ---------- 音集计算 ---------- */
function currentSet(){
  var lib = state.cat === "scale" ? SCALES : CHORDS;
  return lib[state.typeIdx];
}
function pcSet(iv){ return iv.map(function(x){ return (x + state.root) % 12; }); }
function midiSpan(){ /* 两个八度：C4(60) 起的 25 键 */ return 60; }

/* ---------- 钢琴渲染 ---------- */
var pianoEl = document.getElementById("piano");
var keyEls = {}; /* midi -> element */
function buildPiano(){
  pianoEl.innerHTML = ""; keyEls = {};
  var WHITE_PC = [0,2,4,5,7,9,11];
  var start = midiSpan(), whites = 0, i, midi, pc, el, w;
  for(i = 0; i < 25; i++){ if(WHITE_PC.indexOf((start + i) % 12) >= 0) whites++; }
  w = 100 / whites;
  var whiteIdx = 0, frag = document.createDocumentFragment();
  var blacks = [];
  for(i = 0; i < 25; i++){
    midi = start + i; pc = midi % 12;
    if(WHITE_PC.indexOf(pc) >= 0){
      el = document.createElement("div");
      el.className = "wk";
      el.style.left = (whiteIdx * w) + "%";
      el.style.width = w + "%";
      el.dataset.midi = midi;
      frag.appendChild(el);
      keyEls[midi] = el;
      whiteIdx++;
    } else {
      blacks.push({midi:midi, afterWhite:whiteIdx - 1});
    }
  }
  blacks.forEach(function(b){
    el = document.createElement("div");
    el.className = "bk";
    el.style.left = "calc(" + ((b.afterWhite + 1) * w) + "% - " + (w * 0.32) + "%)";
    el.style.width = (w * 0.64) + "%";
    el.dataset.midi = b.midi;
    frag.appendChild(el);
    keyEls[b.midi] = el;
  });
  pianoEl.appendChild(frag);
  Object.keys(keyEls).forEach(function(k){
    var el = keyEls[k];
    el.addEventListener("pointerdown", onKeyPointer);
  });
}
function onKeyPointer(ev){
  var el = ev.currentTarget;
  var midi = parseInt(el.dataset.midi, 10);
  pluck(midi, 0, 0.7, 0.3);
  el.classList.remove("flash");
  void el.offsetWidth;
  el.classList.add("flash");
}

/* ---------- 点亮 ---------- */
function refresh(){
  var set = currentSet(), pcs = pcSet(set.iv), start = midiSpan();
  var rootPc = state.root;
  Object.keys(keyEls).forEach(function(k){
    var el = keyEls[k], midi = parseInt(k, 10);
    var inSet = pcs.indexOf(midi % 12) >= 0;
    el.classList.toggle("hit", inSet);
    /* 音名标签：只标在音集成员上 */
    var old = el.querySelector(".kt");
    if(old) old.remove();
    if(inSet){
      var lab = document.createElement("div");
      lab.className = "kt";
      lab.textContent = NOTES[midi % 12];
      el.appendChild(lab);
    }
  });
  /* 信息区 */
  var en = NOTES[rootPc];
  document.getElementById("scaleName").innerHTML =
    en + " " + set.n + "<small>" + set.en + "</small>";
  var formula;
  if(state.cat === "scale"){
    var steps = [];
    for(var i = 0; i < set.iv.length; i++){
      var next = (i + 1 < set.iv.length) ? set.iv[i + 1] : 12;
      steps.push(next - set.iv[i]);
    }
    formula = "全半结构 " + steps.join(" – ");
  } else {
    formula = "半音 " + set.iv.join(" – ");
  }
  document.getElementById("scaleFormula").textContent = formula;
  var nl = document.getElementById("noteList");
  nl.innerHTML = "";
  pcs.forEach(function(pc, idx){
    var s = document.createElement("span");
    s.textContent = NOTES[pc];
    if(pc === rootPc) s.className = "root";
    nl.appendChild(s);
  });
  document.getElementById("typeLabel").textContent = state.cat === "scale" ? "音阶" : "和弦";
}

/* ---------- 试听 ---------- */
function stopPlay(){
  state.timers.forEach(clearTimeout);
  state.timers = [];
  state.playing = false;
  var b = document.getElementById("playBtn");
  b.textContent = "▶ 整条试听"; b.classList.remove("stop");
}
function playAll(){
  if(state.playing){ stopPlay(); return; }
  ensureAC();
  var set = currentSet(), pcs = pcSet(set.iv), start = midiSpan();
  var midis = [];
  for(var m = start; m < start + 25; m++){
    if(pcs.indexOf(m % 12) >= 0) midis.push(m);
  }
  if(!midis.length) return;
  state.playing = true;
  var b = document.getElementById("playBtn");
  b.textContent = "■ 停止"; b.classList.add("stop");
  if(state.cat === "chord"){
    /* 和弦：齐奏 + 根音低八度铺垫 */
    midis.forEach(function(m, i){ pluck(m, 0, 1.6, 0.22); });
    state.timers.push(setTimeout(stopPlay, 1700));
  } else {
    var step = midis.length > 10 ? 170 : 260;
    midis.forEach(function(m, i){
      pluck(m, i * step / 1000, 0.55, 0.28);
      state.timers.push(setTimeout(function(){
        var el = keyEls[m];
        if(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
      }, i * step));
    });
    state.timers.push(setTimeout(stopPlay, midis.length * step + 500));
  }
}

/* ---------- 复制 ---------- */
function toast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(function(){ t.classList.remove("show"); }, 1600);
}
function copyText(txt, okMsg){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand("copy"); toast(okMsg); }
    catch(e){ toast("复制失败，请手动选择"); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ toast(okMsg); }, fallback);
  } else fallback();
}

/* ---------- 控件绑定 ---------- */
function buildRoots(){
  var box = document.getElementById("roots");
  box.innerHTML = "";
  NOTES.forEach(function(n, i){
    var b = document.createElement("button");
    b.textContent = n;
    if(i === state.root) b.className = "on";
    b.addEventListener("click", function(){
      state.root = i;
      Array.prototype.forEach.call(box.children, function(c, j){ c.className = j === i ? "on" : ""; });
      refresh();
    });
    box.appendChild(b);
  });
}
function buildTypes(){
  var lib = state.cat === "scale" ? SCALES : CHORDS;
  var box = document.getElementById("types");
  box.innerHTML = "";
  if(state.typeIdx >= lib.length) state.typeIdx = 0;
  lib.forEach(function(s, i){
    var b = document.createElement("button");
    b.textContent = s.n;
    if(i === state.typeIdx) b.className = "on";
    b.addEventListener("click", function(){
      state.typeIdx = i;
      Array.prototype.forEach.call(box.children, function(c, j){ c.className = j === i ? "on" : ""; });
      refresh();
    });
    box.appendChild(b);
  });
}
document.getElementById("catScale").addEventListener("click", function(){
  state.cat = "scale"; state.typeIdx = 0;
  this.className = "on"; document.getElementById("catChord").className = "";
  buildTypes(); refresh();
});
document.getElementById("catChord").addEventListener("click", function(){
  state.cat = "chord"; state.typeIdx = 0;
  this.className = "on"; document.getElementById("catScale").className = "";
  buildTypes(); refresh();
});
document.getElementById("playBtn").addEventListener("click", playAll);
document.getElementById("copyBtn").addEventListener("click", function(){
  var set = currentSet(), pcs = pcSet(set.iv);
  var names = pcs.map(function(pc){ return NOTES[pc]; }).join(" ");
  var kind = state.cat === "scale" ? "scale" : "chord";
  copyText(NOTES[state.root] + " " + set.en + " (" + kind + "): " + names, "已复制 " + NOTES[state.root] + " " + set.n);
});
window.addEventListener("keydown", function(ev){
  if(ev.target && /INPUT|TEXTAREA/.test(ev.target.tagName)) return;
  var map = {"a":0,"w":1,"s":2,"e":3,"d":4,"f":5,"t":6,"g":7,"y":8,"h":9,"u":10,"j":11,"k":12};
  var off = map[ev.key.toLowerCase()];
  if(off !== undefined && !ev.repeat){
    var midi = midiSpan() + off;
    pluck(midi, 0, 0.7, 0.3);
    var el = keyEls[midi];
    if(el){ el.classList.remove("flash"); void el.offsetWidth; el.classList.add("flash"); }
  }
  if(ev.key === " "){ ev.preventDefault(); playAll(); }
});

/* ---------- 初始化 ---------- */
buildPiano();
buildRoots();
buildTypes();
refresh();
</script>
</body>
</html>
