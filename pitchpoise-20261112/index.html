<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PITCHPOISE · 音准摆针 — 麦克风实时音高仪</title>
<meta name="description" content="对麦克风哼一个音，摆针与颤音迹线让音准看得见。全程本地，不上传任何声音。">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E">
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="glyph">🎼</span> PITCHPOISE · 音准摆针</h1>
    <p class="tagline">对麦克风哼一个音 / 弹一根弦，摆针告诉你稳不稳。声音只在本机分析，永不上传。</p>
  </header>

  <section class="panel stage">
    <canvas id="gauge" width="720" height="480"></canvas>
    <div class="big-note" id="bigNote">–</div>
    <div class="cents-line" id="centsLine">点下方按钮开启麦克风</div>
    <div class="hz-line" id="hzLine"></div>
    <div class="start-row">
      <button id="startBtn">🎤 开启麦克风</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="panel">
    <h2>定音挑战 · 把音稳在 ±5 音分</h2>
    <div class="challenge-row">
      <div class="challenge-box" id="curBox"><b>0.0<small style="font-size:12px;color:var(--dim)">s</small></b>当前稳住</div>
      <div class="challenge-box" id="bestBox"><b>0.0<small style="font-size:12px;color:var(--dim)">s</small></b>最佳纪录</div>
      <div class="challenge-box" id="badgeBox"><b><span class="badge">🥚</span></b>成就</div>
    </div>
  </section>

  <section class="panel">
    <h2>颤音迹线 · 最近 4 秒音高漂移</h2>
    <canvas id="wobble" width="720" height="220"></canvas>
    <div class="wobble-hint">绿色带 = ±5 音分目标区。抖音唱歌的人会看到自己的波浪，琴弦稳住则是一条直线。</div>
  </section>

  <section class="panel">
    <h2>音符纸带 · 刚才唱过的音</h2>
    <div class="tape" id="tape"><div class="empty-hint">还没有音符。对着麦克风哼一句试试 →</div></div>
  </section>

  <section class="panel">
    <div class="controls">
      <label>A4 校准 <span id="a4val">440</span> Hz</label>
      <input type="range" id="a4range" min="430" max="450" step="1" value="440">
      <span class="spacer"></span>
      <button id="toneBtn" title="播放参考音 A4，约 1.5 秒">🔊 听参考音</button>
      <button id="copyBtn">📋 复制报告</button>
      <button id="stopBtn" disabled>⏹ 停止</button>
    </div>
  </section>

  <footer>
    纯前端 · 自相关法测音高 · 支持人声 / 吉他 / 尤克里里等 · 数据零上传<br>
    <a href="https://github.com/xiangjianan/daily-tools/tree/main/pitchpoise-20261112">源码 GitHub</a> · daily-tools #61 · 2026-11-12
  </footer>
</div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
