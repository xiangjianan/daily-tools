<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GOLDENTAB · 追光时刻表</title>
<meta name="description" content="选地点与日期，即出今天的光线班次表：24h 天空色带 + 黄金/蓝调时刻 + 此刻太阳状态，纯本地计算零上传。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌅</text></svg>">
<style>
:root{
  --bg:#0c1017;--panel:#121826;--panel2:#0f1520;--fg:#e8ecf4;--mut:#8b94a7;--line:#232c3d;
  --gold:#f2b34c;--blue:#5b9dd9;--danger:#e5534b;--ok:#57ab5a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans SC",sans-serif;
  padding:max(20px,env(safe-area-inset-top)) 14px max(36px,env(safe-area-inset-bottom))}
main{max-width:780px;margin:0 auto}
h1{font-size:21px;letter-spacing:.5px}
h1 i{font-style:normal;color:var(--gold)}
.sub{color:var(--mut);font-size:13px;margin:4px 0 18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:13px;color:var(--mut);font-weight:600;letter-spacing:1px;margin-bottom:10px}
label{font-size:12.5px;color:var(--mut);display:block;margin:8px 0 4px}
input[type=text],input[type=date],input[type=number]{
  width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);
  padding:8px 10px;font:inherit;font-size:14px}
input:focus{outline:none;border-color:var(--gold)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;
  font-size:12.5px;color:var(--fg);cursor:pointer;user-select:none}
.chip:hover{border-color:var(--gold)}
.chip.on{background:var(--gold);border-color:var(--gold);color:#1a1206;font-weight:600}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);
  padding:8px 14px;font:inherit;font-size:13.5px;cursor:pointer}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#1a1206;font-weight:700}
.rowflex{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.err{display:none;background:#2a1416;border:1px solid #5c2320;color:#ff8a80;border-radius:8px;
  padding:8px 12px;font-size:13px;margin-top:10px}
.err.show{display:block}
/* ---- hero status ---- */
#status{background:linear-gradient(135deg,#141d2e,#101724);border:1px solid var(--line);border-radius:12px;
  padding:16px;margin-bottom:14px}
#status .phase{font-size:22px;font-weight:700}
#status .detail{color:var(--mut);font-size:13.5px;margin-top:4px}
#status .count{color:var(--gold);font-variant-numeric:tabular-nums}
/* ---- sky band ---- */
.bandwrap{display:flex;gap:10px;align-items:stretch}
.tickcol{display:flex;flex-direction:column;justify-content:space-between;color:var(--mut);
  font-size:11px;font-variant-numeric:tabular-nums;padding:2px 0;flex:0 0 auto}
#band{position:relative;flex:1;min-height:340px;border-radius:10px;border:1px solid var(--line);overflow:hidden}
.mk{position:absolute;left:0;right:0;font-size:10.5px;line-height:1.3;pointer-events:none}
.mk .lab{position:absolute;left:8px;top:2px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.9);white-space:nowrap}
.mk .bar{position:absolute;left:0;right:0;height:0;border-top:1px dashed rgba(255,255,255,.75)}
#nowline{position:absolute;left:0;right:0;height:0;border-top:2px solid var(--danger);z-index:5}
#nowline .nl{position:absolute;right:6px;top:-18px;background:var(--danger);color:#fff;font-size:10px;
  padding:1px 7px;border-radius:4px;font-weight:700}
/* ---- timetable ---- */
.tt{display:flex;flex-direction:column;gap:8px}
.trow{display:flex;gap:12px;align-items:center;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px}
.trow .sw{width:12px;height:44px;border-radius:6px;flex:0 0 auto}
.trow .mid{flex:1;min-width:0}
.trow .nm{font-weight:600;font-size:14.5px}
.trow .tm{color:var(--mut);font-size:12.5px;font-variant-numeric:tabular-nums}
.trow .dur{color:var(--mut);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.stat .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.stat .k{font-size:11px;color:var(--mut);margin-top:2px}
.foot{color:var(--mut);font-size:12px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#1f6f43;
  color:#fff;padding:8px 18px;border-radius:8px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:99}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:560px){
  .summary{grid-template-columns:repeat(2,1fr)}
  .grid3{grid-template-columns:1fr}
  .trow .sw{height:38px}
  #band{min-height:300px}
}
</style>
</head>
<body>
<main>
  <h1>🌅 GOLDENTAB <i>追光时刻表</i></h1>
  <p class="sub">选地点 + 日期，即出「今天的光线班次表」——黄金时刻、蓝调时刻、白昼各班几点评上几点评下，全部本地计算，不联网不上传。</p>

  <div class="card">
    <h2>① 地点</h2>
    <div class="rowflex">
      <button class="btn" id="geoBtn">📍 用我的定位</button>
      <span id="geoNote" style="color:var(--mut);font-size:12px"></span>
    </div>
    <div class="grid2" style="margin-top:10px">
      <div><label for="latIn">纬度（-90 ~ 90，北正南负）</label><input type="number" id="latIn" step="0.0001" value="39.9042"></div>
      <div><label for="lonIn">经度（-180 ~ 180，东正西负）</label><input type="number" id="lonIn" step="0.0001" value="116.4074"></div>
    </div>
    <div class="chips" id="cityChips"></div>
    <div class="err" id="geoErr"></div>
  </div>

  <div class="card">
    <h2>② 日期</h2>
    <div class="rowflex">
      <input type="date" id="dateIn" style="max-width:200px">
      <button class="btn" id="todayBtn">回到今天</button>
      <span class="foot" style="margin:0">时刻按你设备所在时区显示</span>
    </div>
  </div>

  <div id="status">
    <div class="phase" id="stPhase">—</div>
    <div class="detail" id="stDetail">—</div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="card">
    <h2>③ 天空色带 · 00:00 → 24:00</h2>
    <div class="bandwrap">
      <div class="tickcol" id="tickcol"></div>
      <div id="band"></div>
    </div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card">
    <h2>④ 光线班次表</h2>
    <div class="tt" id="tt"></div>
    <div class="rowflex" style="margin-top:14px">
      <button class="btn primary" id="copyBtn">📋 复制今日追光报告</button>
      <span class="foot" style="margin:0">黄金时刻：太阳高度 −4° ~ +6°　蓝调时刻：−6° ~ −4°</span>
    </div>
  </div>

  <p class="foot">算法：NOAA 太阳位置（简化 Meeus），边界按太阳几何高度判定，未计地形遮挡；日出日落含大气折射修正 −0.833°。</p>
</main>
<div id="toast">已复制</div>

<script>
'use strict';
/* ================= constants ================= */
var RAD = Math.PI/180, DEG = 180/Math.PI;
var PHASES = {
  day:    {name:'白昼',       c1:'#3f7fb5', c2:'#6fb3e0'},
  golden: {name:'黄金时刻',   c1:'#e08a3c', c2:'#f2b34c'},
  blue:   {name:'蓝调时刻',   c1:'#2e4f86', c2:'#41639e'},
  nautical:{name:'航海晨昏',  c1:'#1a2a52', c2:'#243765'},
  astro:  {name:'天文晨昏',   c1:'#0e1530', c2:'#131b3a'},
  night:  {name:'深夜',       c1:'#070b14', c2:'#0a0f1c'}
};
var CITIES = [
  ['北京',39.9042,116.4074],['上海',31.2304,121.4737],['广州',23.1291,113.2644],
  ['深圳',22.5431,114.0579],['杭州',30.2741,120.1551],['成都',30.5728,104.0668],
  ['西安',34.3416,108.9398],['乌鲁木齐',43.8256,87.6168],['拉萨',29.6520,91.1721],
  ['漠河',53.4760,122.5387],['三亚',18.2528,109.5119]
];

/* ================= solar math (NOAA / simplified Meeus) ================= */
function julian(dateUTCms){ return dateUTCms/86400000 + 2440587.5; }
function sunAltAz(dateUTCms, lat, lon){
  var n = julian(dateUTCms) - 2451545.0;
  var L = (280.460 + 0.9856474*n) % 360;
  var g = ((357.528 + 0.9856003*n) % 360) * RAD;
  var lambda = (L + 1.915*Math.sin(g) + 0.020*Math.sin(2*g)) * RAD;
  var eps = (23.439 - 0.0000004*n) * RAD;
  var alpha = Math.atan2(Math.cos(eps)*Math.sin(lambda), Math.cos(lambda));
  var delta = Math.asin(Math.sin(eps)*Math.sin(lambda));
  var gmst = (18.697374558 + 24.06570982441908*n) % 24;
  if (gmst < 0) gmst += 24;
  var lst = (gmst*15 + lon) * RAD;
  var H = lst - alpha;
  var phi = lat*RAD;
  var sinAlt = Math.sin(phi)*Math.sin(delta) + Math.cos(phi)*Math.cos(delta)*Math.cos(H);
  var alt = Math.asin(Math.max(-1,Math.min(1,sinAlt)));
  var cosAz = (Math.sin(delta) - sinAlt*Math.sin(phi)) / (Math.cos(alt)*Math.cos(phi));
  var az = Math.acos(Math.max(-1,Math.min(1,cosAz)));
  if (Math.sin(H) > 0) az = 2*Math.PI - az;
  return {alt: alt*DEG, az: az*DEG};
}
function sunAltAlt(min, baseMidnightMs, lat, lon){
  // baseMidnightMs = absolute ms of LOCAL midnight; local minutes add directly (same length everywhere)
  var ms = baseMidnightMs + min*60000;
  return sunAltAz(ms, lat, lon).alt;
}

/* scan a local day: sample every 2 min, find crossings of thresholds */
function scanDay(lat, lon, dayStartLocal){
  var baseMs = dayStartLocal.getTime();
  var M = 1440, step = 2;
  var alts = [];
  for (var t=0; t<=M; t+=step) alts.push(sunAltAlt(t, baseMs, lat, lon));
  var ths = [6, -0.833, -4, -6, -12, -18];
  var events = []; // {min, th, dir(+1 rise / -1 set), alt}
  for (var i=0; i<alts.length-1; i++){
    var a = alts[i], b = alts[i+1];
    for (var k=0;k<ths.length;k++){
      var th = ths[k];
      if ((a-th)*(b-th) < 0){
        var frac = (th-a)/(b-a);
        var min = i*step + frac*step;
        events.push({min:min, th:th, dir:(b>a?1:-1), alt:th});
      }
    }
  }
  events.sort(function(x,y){return x.min-y.min;});
  return {alts:alts, step:step, baseMs:baseMs, events:events};
}
function phaseOfAlt(a){
  if (a >= 6) return 'day';
  if (a >= -4) return 'golden';
  if (a >= -6) return 'blue';
  if (a >= -12) return 'nautical';
  if (a >= -18) return 'astro';
  return 'night';
}

/* build contiguous segments (local minutes) */
function buildSegments(scan){
  var segs = [], cur = 0;
  for (var i=0;i<scan.events.length;i++){
    var e = scan.events[i];
    // phase *before* this boundary: alt just below threshold on the side
    var altBefore = (e.dir>0) ? e.alt-0.01 : e.alt+0.01;
    var ph = phaseOfAlt(altBefore);
    if (e.min > cur + 0.5) segs.push({from:cur, to:e.min, phase:ph});
    cur = e.min;
  }
  var lastAlt = scan.alts[scan.alts.length-1];
  segs.push({from:cur, to:1440, phase:phaseOfAlt(lastAlt)});
  // merge same-phase neighbours
  var out = [];
  for (var j=0;j<segs.length;j++){
    var s = segs[j];
    if (out.length && out[out.length-1].phase===s.phase) out[out.length-1].to = s.to;
    else out.push(s);
  }
  return out;
}

/* color for altitude */
function lerp(a,b,t){ return a+(b-a)*t; }
function hex2rgb(h){ return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]; }
function rgb2css(c){ return 'rgb('+Math.round(c[0])+','+Math.round(c[1])+','+Math.round(c[2])+')'; }
var ALT_STOPS = [
  [-90,'#05080f'],[-18,'#070b14'],[-12,'#131f45'],[-6,'#243a6e'],
  [-4,'#3a4d84'],[-1,'#b06038'],[0,'#e08a3c'],[3,'#f2b34c'],[6,'#7ea9c9'],[15,'#4a8ec4'],[90,'#67aee0']
].map(function(s){return [s[0], hex2rgb(s[1])];});
function colorForAlt(a){
  if (a<=ALT_STOPS[0][0]) return rgb2css(ALT_STOPS[0][1]);
  for (var i=0;i<ALT_STOPS.length-1;i++){
    var p=ALT_STOPS[i], q=ALT_STOPS[i+1];
    if (a>=p[0] && a<=q[0]){
      var t=(a-p[0])/(q[0]-p[0]);
      return rgb2css([lerp(p[1][0],q[1][0],t),lerp(p[1][1],q[1][1],t),lerp(p[1][2],q[1][2],t)]);
    }
  }
  return rgb2css(ALT_STOPS[ALT_STOPS.length-1][1]);
}

/* ================= formatting ================= */
function fmtMin(min){
  if (min==null || isNaN(min)) return '—';
  var m = ((Math.round(min)%1440)+1440)%1440;
  var h = Math.floor(m/60), mm = m%60;
  return (h<10?'0':'')+h+':'+(mm<10?'0':'')+mm;
}
function fmtDur(from,to){
  var d = to-from;
  if (d<0) d+=1440;
  var h = Math.floor(d/60), m = Math.round(d%60);
  return h>0 ? h+' 小时 '+m+' 分' : m+' 分';
}
function el(id){ return document.getElementById(id); }
function showToast(msg){
  var t = el('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(function(){ t.classList.remove('show'); }, 1800);
}

/* ================= state & render ================= */
var state = {lat:39.9042, lon:116.4074, dayStart:null, scan:null, segs:null, isToday:true};

function localDayStart(dateStr){
  var p = dateStr.split('-');
  return new Date(+p[0], +p[1]-1, +p[2], 0, 0, 0, 0);
}
function todayStr(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function render(){
  var err = el('geoErr'); err.classList.remove('show');
  var lat = parseFloat(el('latIn').value), lon = parseFloat(el('lonIn').value);
  if (isNaN(lat)||isNaN(lon)){ showErr('请填写经纬度数字'); return; }
  if (lat<-90||lat>90){ showErr('纬度需在 −90 ~ 90 之间'); return; }
  if (lon<-180||lon>180){ showErr('经度需在 −180 ~ 180 之间'); return; }
  var ds = localDayStart(el('dateIn').value || todayStr());
  state.lat=lat; state.lon=lon; state.dayStart=ds;
  state.isToday = (el('dateIn').value === todayStr());
  state.scan = scanDay(lat, lon, ds);
  state.segs = buildSegments(state.scan);
  renderStatus();
  renderSummary();
  renderBand();
  renderTT();
  renderLegend();
}
function showErr(msg){ var e=el('geoErr'); e.textContent=msg; e.classList.add('show'); }

function findCross(scan, th, dir){
  for (var i=0;i<scan.events.length;i++){
    var e=scan.events[i];
    if (Math.abs(e.th-th)<0.001 && e.dir===dir) return e.min;
  }
  return null;
}

function renderStatus(){
  var now = new Date();
  var nowMin = state.isToday ? (now.getHours()*60+now.getMinutes()+now.getSeconds()/60) : 720;
  var alt;
  if (state.isToday){
    alt = sunAltAlt(nowMin, state.scan.baseUTC, state.lat, state.lon);
  } else {
    alt = sunAltAlt(720, state.scan.baseUTC, state.lat, state.lon);
    nowMin = null;
  }
  var ph = phaseOfAlt(alt);
  var az = sunAltAz(state.scan.baseMs + (nowMin!=null?nowMin:720)*60000, state.lat, state.lon).az;
  var azTxt = az<22.5?'北':az<67.5?'东北':az<112.5?'东':az<157.5?'东南':az<202.5?'南':az<247.5?'西南':az<292.5?'西':az<337.5?'西北':'北';
  var extra = '';
  if (state.isToday){
    var next = null, nextName='';
    var sr = findCross(state.scan,-0.833,1), ss = findCross(state.scan,-0.833,-1);
    if (sr!=null && nowMin<sr){ next=sr; nextName='日出'; }
    else if (ss!=null && nowMin<ss){ next=ss; nextName='日落'; }
    if (next!=null){
      var dm = next-nowMin, h=Math.floor(dm/60), m=Math.round(dm%60);
      extra = ' · 距'+nextName+'还有 <span class="count">'+(h>0?h+' 小时 ':'')+m+' 分钟</span>';
    }
  }
  var dateTxt = state.isToday ? '现在' : '正午（该日）';
  el('stPhase').innerHTML = PHASES[ph].name + ' <span style="color:var(--mut);font-size:14px;font-weight:400">'+dateTxt+'</span>';
  el('stDetail').innerHTML = '太阳高度 <b>'+(alt>=0?'+':'')+alt.toFixed(1)+'°</b> · 方位 '+azTxt+' 方'+extra+
    (state.isToday?'':'　<i style="color:var(--mut)">选「今天」可看实时状态与倒计时</i>');
}

function renderSummary(){
  var s = state.scan;
  var sr = findCross(s,-0.833,1), ss = findCross(s,-0.833,-1);
  var dayLen = (sr!=null&&ss!=null) ? ss-sr : null;
  var noonMin = findSolarNoon(state.scan);
  var html = '';
  html += '<div class="stat"><div class="v">'+fmtMin(sr)+'</div><div class="k">日出</div></div>';
  html += '<div class="stat"><div class="v">'+fmtMin(ss)+'</div><div class="k">日落</div></div>';
  html += '<div class="stat"><div class="v">'+(dayLen!=null?fmtDur(sr,ss):'极昼/极夜')+'</div><div class="k">昼长</div></div>';
  html += '<div class="stat"><div class="v">'+fmtMin(noonMin)+'</div><div class="k">太阳正午</div></div>';
  el('summary').innerHTML = html;
}
function findSolarNoon(scan){
  var best=-90, bestMin=720;
  for (var t=0;t<=1440;t+=1){
    var a=sunAltAlt(t,scan.baseMs,state.lat,state.lon);
    if (a>best){best=a;bestMin=t;}
  }
  return bestMin;
}

function renderBand(){
  var band = el('band');
  var s = state.scan;
  var stops = [];
  for (var i=0;i<s.alts.length;i++){
    var min = i*s.step;
    stops.push(colorForAlt(s.alts[i])+' '+((min/1440*100).toFixed(2))+'%');
  }
  band.style.background = 'linear-gradient(to bottom,'+stops.join(',')+')';
  var html = '';
  // threshold markers: bars for phase boundaries, text labels only for sunrise/sunset
  var marks = [
    {th:-0.833, dir:1,  lab:'日出'},{th:-0.833, dir:-1, lab:'日落'},
    {th:-6, dir:1, lab:''},{th:-6, dir:-1, lab:''},
    {th:6, dir:1, lab:''},{th:6, dir:-1, lab:''}
  ];
  marks.forEach(function(m){
    var t = findCross(s,m.th,m.dir);
    if (t!=null){
      html += '<div class="mk" style="top:'+(t/1440*100)+'%"><div class="bar"></div>'+
        (m.lab?'<div class="lab">'+m.lab+' '+fmtMin(t)+'</div>':'')+'</div>';
    }
  });
  if (state.isToday){
    var now = new Date();
    var nowMin = (now.getHours()*60+now.getMinutes())/1440*100;
    html += '<div id="nowline" style="top:'+nowMin+'%"><span class="nl">此刻</span></div>';
  }
  band.innerHTML = html;
  // time ticks
  var tc = el('tickcol');
  var ticks = '';
  [0,4,8,12,16,20,24].forEach(function(h){
    ticks += '<span>'+String(h).padStart(2,'0')+':00</span>';
  });
  tc.innerHTML = ticks;
}

function renderTT(){
  var segs = state.segs;
  var html = '';
  segs.forEach(function(sg){
    var p = PHASES[sg.phase];
    var isGold = sg.phase==='golden', isBlue = sg.phase==='blue';
    var nm = p.name;
    if (isGold){
      var mid=(sg.from+sg.to)/2;
      nm += mid<720 ? '（晨）' : '（暮）';
    }
    if (isBlue){
      var mid2=(sg.from+sg.to)/2;
      nm += mid2<720 ? '（晨）' : '（暮）';
    }
    html += '<div class="trow">'+
      '<div class="sw" style="background:linear-gradient(to bottom,'+p.c2+','+p.c1+')"></div>'+
      '<div class="mid"><div class="nm">'+nm+'</div>'+
      '<div class="tm">'+fmtMin(sg.from)+' → '+fmtMin(sg.to)+(sg.to===1440?'（次日）':'')+'</div></div>'+
      '<div class="dur">'+fmtDur(sg.from,sg.to)+'</div></div>';
  });
  el('tt').innerHTML = html;
}

function renderLegend(){
  var html='';
  ['golden','blue','day','nautical','astro','night'].forEach(function(k){
    var p=PHASES[k];
    html += '<span><i style="background:linear-gradient(135deg,'+p.c2+','+p.c1+')"></i>'+p.name+'</span>';
  });
  el('legend').innerHTML = html;
}

/* ================= report copy ================= */
function buildReport(){
  var s=state.scan, lines=[];
  var city = document.querySelector('.chip.on');
  var place = city ? city.textContent : ('纬度 '+state.lat.toFixed(4)+'°, 经度 '+state.lon.toFixed(4)+'°');
  lines.push('🌅 GOLDENTAB 追光时刻表 · '+el('dateIn').value);
  lines.push('地点：'+place);
  var sr=findCross(s,-0.833,1), ss=findCross(s,-0.833,-1);
  lines.push('日出 '+fmtMin(sr)+' · 日落 '+fmtMin(ss)+' · 昼长 '+(sr!=null&&ss!=null?fmtDur(sr,ss):'极昼/极夜'));
  lines.push('');
  state.segs.forEach(function(sg){
    var p=PHASES[sg.phase];
    var nm=p.name;
    if (sg.phase==='golden'||sg.phase==='blue') nm += (sg.from+sg.to)/2<720?'（晨）':'（暮）';
    lines.push(nm+'　'+fmtMin(sg.from)+' → '+fmtMin(sg.to)+'　'+fmtDur(sg.from,sg.to));
  });
  lines.push('');
  lines.push('黄金时刻 = 太阳高度 −4°~+6°（顺光柔暖最上相）｜蓝调时刻 = −6°~−4°（天光深蓝城市灯亮）');
  lines.push('— 由 GOLDENTAB 本地生成 · https://xiangjianan.github.io/daily-tools/goldentab-20261105/');
  return lines.join('\n');
}
function copyReport(){
  var txt = buildReport();
  function fallback(){
    var ta=document.createElement('textarea');
    ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); showToast('已复制'); }
    catch(e){ showToast('复制失败，请手动选择'); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(function(){ showToast('已复制'); }, fallback);
  } else fallback();
}

/* ================= interactions ================= */
function setActiveChip(name){
  document.querySelectorAll('.chip').forEach(function(c){
    c.classList.toggle('on', c.textContent===name);
  });
}
function initChips(){
  var wrap = el('cityChips');
  CITIES.forEach(function(c){
    var b=document.createElement('button');
    b.className='chip'; b.type='button'; b.textContent=c[0];
    b.addEventListener('click',function(){
      el('latIn').value=c[1]; el('lonIn').value=c[2];
      setActiveChip(c[0]);
      render();
    });
    wrap.appendChild(b);
  });
  setActiveChip('北京');
}
function initGeo(){
  el('geoBtn').addEventListener('click',function(){
    if (!navigator.geolocation){ el('geoNote').textContent='此浏览器不支持定位'; return; }
    el('geoNote').textContent='正在定位…';
    navigator.geolocation.getCurrentPosition(function(pos){
      el('latIn').value=pos.coords.latitude.toFixed(4);
      el('lonIn').value=pos.coords.longitude.toFixed(4);
      el('geoNote').textContent='定位成功（±'+Math.round(pos.coords.accuracy)+'m）';
      setActiveChip(''); render();
    }, function(err){
      el('geoNote').textContent='';
      showErr('定位失败：'+(err.code===1?'你拒绝了授权':err.code===2?'信号不可用':'超时')+'，可手填经纬度或点城市');
    }, {timeout:8000});
  });
}
function init(){
  initChips();
  el('dateIn').value = todayStr();
  el('dateIn').addEventListener('change', function(){
    setActiveChip(document.querySelector('.chip.on') && document.querySelector('.chip.on').textContent);
    render();
  });
  el('todayBtn').addEventListener('click', function(){
    el('dateIn').value = todayStr(); render();
  });
  el('latIn').addEventListener('change', function(){ setActiveChip(''); render(); });
  el('lonIn').addEventListener('change', function(){ setActiveChip(''); render(); });
  el('copyBtn').addEventListener('click', copyReport);
  initGeo();
  render();
  // refresh now-line every minute
  setInterval(function(){
    if (state.isToday){
      var now = new Date();
      var nl = document.getElementById('nowline');
      if (nl){
        var pct = (now.getHours()*60+now.getMinutes())/1440*100;
        nl.style.top = pct+'%';
      }
      renderStatus();
    }
  }, 60000);
}
init();
</script>
